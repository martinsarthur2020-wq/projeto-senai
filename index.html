<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Prova</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="tela-entrada" class="container-entrada">
        <h2>Bem-vindo(a)!</h2>
        <p>Por favor, insira o seu nome para iniciar a prova:</p>
        <input type="text" id="nome-aluno" placeholder="Digite o seu nome completo" required>
        <button onclick="iniciarProva()">Iniciar Prova</button>
    </div>
    <div id="tela-prova" style="display: none;">
        <h3 id="saudacao-aluno"></h3>
        <h1>Prova de Conhecimentos</h1>
         <div class="container">
    <h1>Plataforma de Avaliação</h1>
    <div id="abas-provas" class="abas-container"></div>
    <div id="conteudo-provas"></div>
    <div class="painel-historico">
      <h2>Histórico de Notas</h2>
      <div id="historico-notas"></div>
      <button type="button" class="btn-limpar" onclick="limparDados()">Limpar Progresso</button>
    </div>
</div> 
    </div>
    <script src="script.js"></script>
</body>
</html>
